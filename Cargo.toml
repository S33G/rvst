[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
repository = "https://github.com/S33G/rvst"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["RVST contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
