[package]
repository.workspace = true
name = "rvst-vst3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
rvst-core = { version = "0.1.0", path = "../rvst-core" }
rvst-adapter = { version = "0.1.0", path = "../rvst-adapter" }
rvst-ui = { version = "0.1.0", path = "../rvst-ui" }
rvst-platform = { version = "0.1.0", path = "../rvst-platform" }
vst3 = "0.3"

[features]
default = []
devtools = ["rvst-adapter/devtools"]

[dev-dependencies]
rvst-test = { version = "0.1.0", path = "../rvst-test" }
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
