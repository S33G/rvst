schema_version = 1
version = "0.1.0"
sdk_version = "^0.1"
id = "midi"
name = "MIDI Transpose"
description = "MIDI transpose preserving note-off mapping."

[inputs.crate_name]
type = "identifier"
description = "Rust project directory/package identifier"
required = true
[inputs.plugin_name]
type = "string"
description = "Display name shown to hosts"
default = "MIDI Transpose"
[inputs.vendor]
type = "string"
description = "Plugin vendor"
default = "Your Name"
[inputs.url]
type = "string"
description = "Vendor website"
default = "https://example.com"
[inputs.email]
type = "string"
description = "Support email"
default = "support@example.com"
[inputs.kind]
type = "choice"
description = "Plugin processor family"
default = "midi"
choices = ["midi"]

[inputs.plugin_id]
type = "string"
description = "Stable reverse-domain plugin identifier (default org.rvst.project-name)"

[inputs.audio_mode]
type = "choice"
description = "Pure MIDI or stereo audio pass-through"
choices = ["pure-midi", "pass-through"]
default = "pure-midi"
