[package]
repository.workspace = true
name = "rvst-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rvst-core = { path = "../rvst-core", version = "0.1.0" }
rvst-ui = { path = "../rvst-ui", version = "0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "=0.36.1", default-features = false, features = ["glow", "default_fonts", "web_screen_reader"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
